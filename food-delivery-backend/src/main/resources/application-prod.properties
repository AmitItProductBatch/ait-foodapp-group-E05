# ==============================================================================
# FoodDelivery Backend - Production Configuration (Group 05)
# Server IP: 194.242.57.93
# ==============================================================================

# Server Configuration
server.port=8085

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:194.242.57.93}:${DB_PORT:5005}/fooddelivery05
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================================
# Spring Boot Actuator & Prometheus Metrics Configuration
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=food-delivery-backend
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ==============================================================================
# Loki Logging Configuration
# ==============================================================================
loki.url=http://194.242.57.93:3100/loki/api/v1/push
logging.level.root=INFO
logging.level.com.ait=DEBUG

# ==============================================================================
# Mail / Portmailer Configuration
# ==============================================================================
spring.mail.host=194.242.57.93
spring.mail.port=587
spring.mail.username=admin@fooddelivery05.com
spring.mail.password=postgres
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
